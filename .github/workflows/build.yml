name: Build otto-robot

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  IDF_VERSION: v5.4.1
  IDF_TARGET: esp32s3
  PYTHON_VERSION: "3.11"

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Mark workspace safe for git
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global --add safe.directory "$GITHUB_WORKSPACE/main/boards/otto-robot"

      - name: Verify workspace structure
        run: |
          echo "==> workspace <=="
          ls -la
          echo "==> boards/otto-robot <=="
          if [ -d "main/boards/otto-robot" ]; then
            ls -la main/boards/otto-robot | head -20
          else
            echo "[ERROR] main/boards/otto-robot 目录不存在"
            find . -maxdepth 4 -name "otto_robot.cc" 2>/dev/null
            exit 1
          fi

      - name: Cache ESP-IDF
        uses: actions/cache@v4
        with:
          path: |
            ~/.espressif
            ~/.cache/pip
          key: ${{ runner.os }}-esp-idf-${{ env.IDF_VERSION }}-py${{ env.PYTHON_VERSION }}-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-esp-idf-${{ env.IDF_VERSION }}-py${{ env.PYTHON_VERSION }}-
            ${{ runner.os }}-esp-idf-${{ env.IDF_VERSION }}-

      # ---------- 关键修复：换回 esp-idf-action@v1 ----------
      - name: Install ESP-IDF ${{ env.IDF_VERSION }}
        uses: espressif/esp-idf-action@v1
        with:
          esp_idf_version: ${{ env.IDF_VERSION }}
          target: ${{ env.IDF_TARGET }}

      - name: Inject wake-word config
        run: |
          cd main/boards/otto-robot
          if [ -f "config.custom-wake.json" ]; then
            echo "已注入自定义唤醒词配置: kaka / 卡卡"
          fi

      - name: Configure project
        run: |
          . $IDF_PATH/export.sh
          idf.py set-target ${{ env.IDF_TARGET }}
          idf.py reconfigure

      - name: Build firmware
        run: |
          . $IDF_PATH/export.sh
          idf.py build

      - name: Merge into single bin
        run: |
          . $IDF_PATH/export.sh
          cd build
          mkdir -p merge
          APP_OFF=$(python3 -c "import json;d=json.load(open('flasher_args.json'));print(hex(int(d['flash_files'][d['flash_settings']['flash_offsets']['app']],16)))")
          APP=$(python3 -c "import json;d=json.load(open('flasher_args.json'));print(d['flash_files'][d['flash_settings']['flash_offsets']['app']])")
          echo "App partition: $APP @ $APP_OFF"
          esptool.py --chip esp32s3 merge_bin \
            --output merge/otto-robot-merged.bin \
            --fill-flash-size 16MB \
            0x0     bootloader/bootloader.bin \
            0x8000  partition_table/partition-table.bin \
            "$APP_OFF" "$APP"
          ls -la merge/

      - name: Collect artifacts
        run: |
          mkdir -p build_output
          cp build/merge/otto-robot-merged.bin build_output/
          cp build/bootloader/bootloader.bin build_output/
          cp build/partition_table/partition-table.bin build_output/
          cp build/flasher_args.json build_output/
          cat > build_output/flash.sh <<'SH'
          #!/bin/bash
          PORT="${PORT:-/dev/ttyUSB0}"
          BIN="otto-robot-merged.bin"
          esptool.py --chip esp32s3 --port "$PORT" --baud 921600 \
            write_flash --flash_size 16MB --flash_mode dio 0x0 "$BIN"
          SH
          chmod +x build_output/flash.sh
          ls -la build_output/

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: otto-robot-firmware-${{ github.sha }}
          path: build_output/
          retention-days: 30
          if-no-files-found: error

  sign:
    needs: build
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: otto-robot-firmware-${{ github.sha }}
          path: build_output
      - name: Sign firmware
        env:
          SIGNING_KEY: ${{ secrets.ESP_SIGNING_KEY }}
        run: |
          if [ -z "$SIGNING_KEY" ]; then
            echo "未配置 ESP_SIGNING_KEY，跳过签名"
            exit 0
          fi
          echo "$SIGNING_KEY" > key.pem
          echo "signing..."
          mv build_output/otto-robot-merged.bin build_output/otto-robot-merged-signed.bin

  release:
    needs: [build, sign]
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: otto-robot-firmware-${{ github.sha }}
          path: build_output
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build_output/otto-robot-merged.bin
            build_output/otto-robot-merged-signed.bin
          draft: false
          prerelease: false
